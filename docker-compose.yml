services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintwin
      POSTGRES_USER: fintwin
      POSTGRES_PASSWORD: fintwin
    ports:
      - "5432:5432"
    volumes:
      - fintwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintwin -d fintwin"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  fintwin_pg:
